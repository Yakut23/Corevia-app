name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files (www)
        run: |
          HTML=$(find . -iname "index.html" -not -path "./node_modules/*" -not -path "./www/*" | head -n 1)
          if [ -z "$HTML" ]; then
            echo "ERROR: index.html haipatikani"
            ls -R | grep -v node_modules | head -50
            exit 1
          fi
          echo "Found: $HTML"
          mkdir -p www
          cp -r "$(dirname "$HTML")"/. www/
          rm -rf www/.git www/.github www/scripts www/node_modules

      - name: Install dependencies
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android pdfjs-dist@3.11.174

      - name: Copy pdf.js (offline)
        run: node scripts/prepare-www.js

      - name: Init Capacitor and add Android
        run: |
          npx cap init "Corevia" "com.corevia.app" --web-dir=www
          npx cap add android

      - name: Patch Android (fullscreen + secure)
        run: node scripts/patch-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: corevia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
