name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check www
        run: |
          test -f www/index.html || { echo "ERROR: www/index.html haipo"; exit 1; }
          ls -R www

      - name: Install dependencies
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor and add Android
        run: |
          rm -rf android capacitor.config.json capacitor.config.ts
          npx cap init "Corevia" "com.corevia.app" --web-dir=www
          npx cap add android

      - name: Patch Android (fullscreen + secure)
        run: node scripts/patch-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: corevia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
